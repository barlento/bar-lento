<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar Lento — Turni</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F3EDE1; --surface: #FFFCF6; --surface-2: #EAE0CC;
    --ink: #241A12; --ink-muted: #6B5D4C; --border: #DBCCAF;
    --accent: #C9701E; --accent-ink: #4A2A0C; --accent-soft: #F0DCBB;
    --teal: #2D7E72; --teal-soft: #DCEDE9; --good: #4C7A44; --good-soft: #E1EBDC;
    --shadow: 0 1px 2px rgba(36,26,18,.06), 0 8px 24px -12px rgba(36,26,18,.25);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #16110D; --surface: #201810; --surface-2: #2B2018;
      --ink: #F3EAD9; --ink-muted: #B9A98E; --border: #3A2C1E;
      --accent: #E08A2C; --accent-ink: #2A1806; --accent-soft: #3D2A12;
      --teal: #59C4B4; --teal-soft: #1B3733; --good: #8FBF7F; --good-soft: #23301F;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -14px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg: #16110D; --surface: #201810; --surface-2: #2B2018;
    --ink: #F3EAD9; --ink-muted: #B9A98E; --border: #3A2C1E;
    --accent: #E08A2C; --accent-ink: #2A1806; --accent-soft: #3D2A12;
    --teal: #59C4B4; --teal-soft: #1B3733; --good: #8FBF7F; --good-soft: #23301F;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Karla', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,.display{ font-family:'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; text-wrap: balance; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .wrap{ max-width:920px; margin:0 auto; padding:20px 18px 56px; }
  header.top{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:20px 22px; margin-bottom:16px; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); }
  .brand{ display:flex; align-items:baseline; gap:12px; }
  .brand .mark{ font-size:1.9rem; line-height:1; }
  .brand h1{ font-size:1.6rem; font-weight:700; margin:0; letter-spacing:-.01em; }
  .brand .tag{ color:var(--ink-muted); font-size:.88rem; }
  .updated{ font-size:.72rem; color:var(--ink-muted); text-align:right; }
  .hero{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:18px 22px; margin-bottom:18px; border-radius:16px; box-shadow:var(--shadow); background:var(--accent-soft); color:var(--accent-ink); border:1px solid var(--border); }
  .hero.open{ background:var(--good-soft); color:var(--ink); }
  .hero .status{ display:flex; align-items:center; gap:10px; }
  .hero .status .led{ width:11px; height:11px; border-radius:50%; background:var(--ink-muted); flex:none; }
  .hero.open .status .led{ background:var(--good); box-shadow:0 0 0 4px color-mix(in srgb, var(--good) 25%, transparent); }
  .hero .status .text{ font-size:1.02rem; font-weight:700; }
  .hero .status .sub{ font-size:.82rem; font-weight:500; opacity:.85; }
  .hero .whoworks{ font-size:.85rem; text-align:right; }
  .hero .whoworks .names{ font-weight:600; }
  .tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .tab{ flex:1; text-align:center; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--ink-muted); font-weight:700; font-size:.86rem; cursor:pointer; transition: background .12s ease, color .12s ease, border-color .12s ease; }
  .tab.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .tab:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .days{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px; margin-bottom:22px; }
  .day-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:11px; box-shadow:var(--shadow); }
  .day-card.today{ border-color:var(--accent); }
  .day-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .day-head .name{ font-weight:700; font-size:1.02rem; }
  .day-head .date{ color:var(--ink-muted); font-size:.78rem; }
  .day-hours{ display:inline-flex; align-self:flex-start; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:.74rem; font-weight:600; background:var(--accent-soft); color:var(--accent-ink); }
  .day-card.late .day-hours{ background:var(--teal-soft); color:var(--teal); }
  .shifts{ display:flex; flex-direction:column; gap:7px; }
  .shift{ display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--surface-2); border-radius:9px; padding:7px 10px; font-size:.85rem; }
  .shift .who{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .shift .when{ color:var(--ink-muted); font-size:.78rem; white-space:nowrap; }
  .empty-note{ color:var(--ink-muted); font-size:.78rem; font-style:italic; }
  .btn{ border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:10px; padding:8px 14px; font-size:.84rem; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn:hover{ border-color:var(--accent); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  footer.note{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; color:var(--ink-muted); font-size:.78rem; }
  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:.86rem; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="mark">🍸</span>
      <div>
        <h1>Bar Lento</h1>
        <div class="tag">Turni della settimana — New York</div>
      </div>
    </div>
    <div class="updated" id="updatedNote"></div>
  </header>

  <div class="hero" id="heroStatus"></div>
  <div class="tabs" id="weekTabs"></div>
  <div class="days" id="daysGrid"></div>

  <footer class="note">
    <span>Aggiornato dal gestore ogni settimana.</span>
    <button class="btn" id="copyBtn">Copia come testo</button>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var DAY_KEYS = ["mon","tue","wed","thu","fri","sat","sun"];
  var DAY_NAMES = {mon:"Lunedì", tue:"Martedì", wed:"Mercoledì", thu:"Giovedì", fri:"Venerdì", sat:"Sabato", sun:"Domenica"};
  var OPENING = {
    mon:{open:"16:00", close:"22:00"}, tue:{open:"16:00", close:"22:00"},
    wed:{open:"16:00", close:"22:00"}, thu:{open:"16:00", close:"22:00"},
    fri:{open:"16:00", close:"23:00"}, sat:{open:"16:00", close:"23:00"},
    sun:{open:"16:00", close:"22:00"}
  };
  var MONTHS_IT = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
  var DAY_KEY_BY_JSDAY = ["sun","mon","tue","wed","thu","fri","sat"];

  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function toISO(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function fromISO(s){ var p=s.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
  function mondayOf(d){
    var day = d.getDay();
    var diff = (day === 0) ? -6 : 1 - day;
    var m = new Date(d); m.setDate(d.getDate()+diff); m.setHours(0,0,0,0);
    return m;
  }
  function addDays(d, n){ var r = new Date(d); r.setDate(d.getDate()+n); return r; }
  function isSameDay(a,b){ return toISO(a)===toISO(b); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  var WEEKS = {};
  var weekKeys = [];
  var activeWeek = null;
  var PUBLISHED_AT = null;

  function weekLabel(startISO, isFirst){
    var start = fromISO(startISO);
    var end = addDays(start, 6);
    var range = (start.getMonth() === end.getMonth())
      ? start.getDate() + "–" + end.getDate() + " " + MONTHS_IT[end.getMonth()]
      : start.getDate() + " " + MONTHS_IT[start.getMonth()] + " – " + end.getDate() + " " + MONTHS_IT[end.getMonth()];
    return (isFirst ? "Questa settimana · " : "Prossima · ") + range;
  }

  function renderUpdated(){
    var d = PUBLISHED_AT ? new Date(PUBLISHED_AT) : new Date();
    document.getElementById("updatedNote").textContent =
      "Aggiornato " + pad(d.getDate()) + "/" + pad(d.getMonth()+1) + " alle " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function renderHero(){
    var now = new Date();
    var todayKey = DAY_KEY_BY_JSDAY[now.getDay()];
    var hours = OPENING[todayKey];
    var mins = now.getHours()*60 + now.getMinutes();
    var openMins = 16*60;
    var closeMins = (hours.close === "23:00") ? 23*60 : 22*60;
    var isOpenNow = mins >= openMins && mins < closeMins;

    var todayISO = toISO(mondayOf(now));
    var dayData = (WEEKS[todayISO] && WEEKS[todayISO][todayKey]) || [];
    var names = dayData.map(function(s){ return s.name; });

    var el = document.getElementById("heroStatus");
    el.className = "hero" + (isOpenNow ? " open" : "");
    el.innerHTML =
      '<div class="status"><span class="led"></span><div>'
      + '<div class="text">' + (isOpenNow ? "Aperto ora" : "Chiuso ora") + '</div>'
      + '<div class="sub mono">' + DAY_NAMES[todayKey] + ' · ' + hours.open + '–' + hours.close + '</div>'
      + '</div></div>'
      + '<div class="whoworks">' + (names.length
          ? 'Oggi al banco: <span class="names">' + names.map(escapeHtml).join(", ") + '</span>'
          : 'Nessun turno assegnato per oggi') + '</div>';
  }

  function renderTabs(){
    var el = document.getElementById("weekTabs");
    el.innerHTML = weekKeys.map(function(k, i){
      return '<button type="button" class="tab' + (k === activeWeek ? " active" : "") + '" data-week="' + k + '">' + weekLabel(k, i === 0) + '</button>';
    }).join("");
    el.querySelectorAll(".tab").forEach(function(btn){
      btn.addEventListener("click", function(){
        activeWeek = btn.getAttribute("data-week");
        renderTabs();
        renderDays();
      });
    });
  }

  function renderDays(){
    var grid = document.getElementById("daysGrid");
    var start = fromISO(activeWeek);
    var today = new Date();
    var days = WEEKS[activeWeek] || {};

    grid.innerHTML = DAY_KEYS.map(function(key, i){
      var date = addDays(start, i);
      var hours = OPENING[key];
      var isLate = key === "fri" || key === "sat";
      var isToday = isSameDay(date, today);
      var shifts = days[key] || [];
      var shiftsHtml = shifts.length
        ? shifts.map(function(s){
            return '<div class="shift"><span class="who">' + escapeHtml(s.name) + '</span><span class="when mono">' + s.start + '–' + s.end + '</span></div>';
          }).join("")
        : '<div class="empty-note">Nessun turno assegnato</div>';

      return '<div class="day-card' + (isLate?" late":"") + (isToday?" today":"") + '">'
        + '<div class="day-head"><span class="name">' + DAY_NAMES[key] + '</span><span class="date mono">' + pad(date.getDate()) + '/' + pad(date.getMonth()+1) + '</span></div>'
        + '<span class="day-hours mono">' + hours.open + ' – ' + hours.close + '</span>'
        + '<div class="shifts">' + shiftsHtml + '</div>'
        + '</div>';
    }).join("");
  }

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._h);
    t._h = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  function buildSummary(){
    var lines = [];
    weekKeys.forEach(function(wk, wi){
      var start = fromISO(wk);
      lines.push("🍸 Bar Lento — Turni " + weekLabel(wk, wi === 0).replace(/^(Questa settimana|Prossima) · /, ""));
      lines.push("");
      DAY_KEYS.forEach(function(key, i){
        var date = addDays(start, i);
        var hours = OPENING[key];
        lines.push(DAY_NAMES[key] + " " + pad(date.getDate()) + "/" + pad(date.getMonth()+1) + " (apertura " + hours.open + "–" + hours.close + ")");
        var shifts = (WEEKS[wk][key] || []);
        if (shifts.length){ shifts.forEach(function(s){ lines.push("  • " + s.name + " " + s.start + "–" + s.end); }); }
        else { lines.push("  — nessun turno assegnato —"); }
      });
      lines.push("");
    });
    return lines.join("\n").trim();
  }

  document.getElementById("copyBtn").addEventListener("click", function(){
    var text = buildSummary();
    var done = function(){ toast("Copiato!"); };
    var fail = function(){
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand("copy"); done(); } catch(e){ toast("Copia non riuscita"); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(fail); }
    else { fail(); }
  });

  fetch("./data.json", {cache: "no-store"})
    .then(function(r){ return r.json(); })
    .then(function(data){
      WEEKS = data.weeks || {};
      PUBLISHED_AT = data.publishedAt || null;
      weekKeys = Object.keys(WEEKS).sort();
      var todayMondayISO = toISO(mondayOf(new Date()));
      activeWeek = weekKeys.indexOf(todayMondayISO) !== -1 ? todayMondayISO : weekKeys[0];
      renderUpdated();
      renderHero();
      renderTabs();
      renderDays();
    })
    .catch(function(){
      document.getElementById("daysGrid").innerHTML = '<div class="empty-note">Impossibile caricare i turni al momento.</div>';
    });
})();
</script>
</body>
</html>
